<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafafb">
<title>Site OS Mobile - Prototype</title>
<script>
// The host lets browsers keep files for ten minutes. A fresh query string on every load makes
// the stylesheet and scripts always come from the latest push, so a plain refresh is enough.
var V_NOW = Date.now();
// Appearance: 'light', 'dark' or 'system' (follows the device), remembered per browser.
function themePref() { try { return localStorage.getItem('theme') || 'system'; } catch (e) { return 'system'; } }
function applyTheme() { var p = themePref(), dark = p === 'dark' || (p === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.dataset.theme = dark ? 'dark' : 'light'; var m = document.querySelector('meta[name=theme-color]'); if (m) m.content = dark ? '#0B1020' : '#fafafb'; }
applyTheme();
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
document.write('<link rel="stylesheet" href="styles.css?v=' + V_NOW + '">');
</script>
</head>
<body>
<main class="stage">
  <aside class="panel" id="panel"></aside>
  <div class="phone">
    <div class="screen" id="screen">
      <div class="status"><span class="time">9:41</span><span class="island"></span></div>
      <div class="view" id="view"></div>
      <div id="dock"></div>
      <nav class="tabbar" id="tabbar"></nav>
      <button class="fab" id="fab" data-go="oscar" aria-label="Ask Oscar"></button>
      <div class="sheet" id="sheet" aria-hidden="true">
        <div class="sheet-bg" data-act="closeSheet"></div>
        <div class="sheet-panel"><div class="sheet-grab"></div><div id="sheet-body"></div></div>
      </div>
      <div class="toast" id="toast"></div>
    </div>
  </div>
</main>
<script>
['icons', 'data', 'screens', 'forms', 'requests', 'team', 'app'].forEach(function (f) {
  document.write('<script src="' + f + '.js?v=' + V_NOW + '"><\/script>');
});
</script>
</body>
</html>
